# testcase03 (SPEC 12.1): replicas with the bench component. filter drops
# every chunk whose number is a multiple of its replica count, so replica 0
# gets chunks but outputs none and must still end with EOS. hack/e2e.sh sets
# the image, pinned by digest, the test sets the sizes, and the test
# creates the Secret alpheus-s3 in its namespace.
apiVersion: alpheus-dev.org/v1alpha1
kind: StreamRun
metadata:
  name: testcase03
spec:
  steps:
    - name: source
      image: ${BENCH_IMAGE}
      settings: {role: source, chunks: ${BENCH_CHUNKS}, size: ${BENCH_SIZE}, seed: 3}
    - name: filter
      image: ${BENCH_IMAGE}
      replicas: ${BENCH_FILTER_REPLICAS}
      settings: {role: pass, drop: ${BENCH_FILTER_REPLICAS}}
    - name: sink
      image: ${BENCH_IMAGE}
      settings: {role: sink, chunks: ${BENCH_CHUNKS}, size: ${BENCH_SIZE}, seed: 3, skip: ${BENCH_FILTER_REPLICAS}}
  edges:
    - {from: source, to: filter}
    - {from: filter, to: sink}
  chunks: {maxBytes: 1Gi, maxUnacked: ${BENCH_MAX_UNACKED}}
  storage:
    endpoint: http://garage.storage.svc.cluster.local:3900
    bucket: alpheus-data
    region: garage
    secretRef: alpheus-s3
