# testcase04 (SPEC 12.1): restarts. The test kills one step's pod in the
# middle of the stream. source is fixed, so a restarted source makes the
# same chunks (GO-92), and sink is slow, so the test has time to act.
# hack/e2e.sh sets the image, pinned by digest, the test sets the sizes,
# and the test creates the Secret alpheus-s3 in its namespace.
apiVersion: alpheus-dev.org/v1alpha1
kind: StreamRun
metadata:
  name: testcase04
spec:
  steps:
    - name: source
      image: ${BENCH_IMAGE}
      settings: {role: source, chunks: ${BENCH_CHUNKS}, size: ${BENCH_SIZE}, seed: 4, fixed: true}
    - name: pass
      image: ${BENCH_IMAGE}
      settings: {role: pass}
    - name: sink
      image: ${BENCH_IMAGE}
      settings: {role: sink, chunks: ${BENCH_CHUNKS}, size: ${BENCH_SIZE}, seed: 4, delay: 100}
  edges:
    - {from: source, to: pass}
    - {from: pass, to: sink}
  chunks: {maxBytes: 1Gi, maxUnacked: ${BENCH_MAX_UNACKED}}
  storage:
    endpoint: http://garage.storage.svc.cluster.local:3900
    bucket: alpheus-data
    region: garage
    secretRef: alpheus-s3
