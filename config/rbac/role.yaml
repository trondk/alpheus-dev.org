---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alpheus-controller
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - alpheus-dev.org
  resources:
  - streamruns
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - alpheus-dev.org
  resources:
  - streamruns/finalizers
  verbs:
  - update
- apiGroups:
  - alpheus-dev.org
  resources:
  - streamruns/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
