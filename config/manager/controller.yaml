# The controller, with the builtin signal hub in the leader (GO-73). The
# hub's Service selects only the pod labelled as the active hub. The
# agent's image is set with -agent-image by an overlay, pinned by digest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpheus-controller
  namespace: alpheus-system
  labels:
    app.kubernetes.io/name: alpheus-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alpheus-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alpheus-controller
    spec:
      serviceAccountName: alpheus-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: alpheus-controller
          args:
            - -agent-image=alpheus-agent
            - -hub-address=alpheus-signal-hub.alpheus-system.svc:7070
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports:
            - {name: signal-hub, containerPort: 7070}
            - {name: metrics, containerPort: 9090}
            - {name: health, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: alpheus-signal-hub
  namespace: alpheus-system
spec:
  selector:
    app.kubernetes.io/name: alpheus-controller
    alpheus-dev.org/signal-hub: active
  ports:
    - {name: signal-hub, port: 7070, targetPort: signal-hub}
