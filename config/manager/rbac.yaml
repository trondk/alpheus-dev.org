kind: ClusterRoleBinding
metadata:
  name: alpheus-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alpheus-controller
subjects:
  - kind: ServiceAccount
    name: alpheus-controller
    namespace: alpheus-system
