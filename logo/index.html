<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpheus logos</title>
<style>
body { margin: 0; font-family: Georgia, serif; color: #23292D; }
section { padding: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; }
section.light { background: #EEF0EE; } section.dark { background: #23292D; color: #EEF0EE; }
h2 { grid-column: 1 / -1; margin: 0; font-weight: 600; }
figure { margin: 0; text-align: center; }
img { width: 100%; height: 200px; object-fit: contain; }
.small img { height: 48px; }
</style></head><body>
<section class="light"><h2>On the light background</h2><figure><img src="1-roundel.svg" alt="1 · Roundel, for stickers"><figcaption>1 · Roundel, for stickers</figcaption></figure><figure><img src="4-modern.svg" alt="4 · Modern"><figcaption>4 · Modern</figcaption></figure><figure><img src="4-modern-motto.svg" alt="4 · Modern, with the motto"><figcaption>4 · Modern, with the motto</figcaption></figure></section>
<section class="dark"><h2>On the dark background</h2><figure><img src="1-roundel.svg" alt="1 · Roundel, for stickers"><figcaption>1 · Roundel, for stickers</figcaption></figure><figure><img src="4-modern-dark.svg" alt="4 · Modern"><figcaption>4 · Modern</figcaption></figure><figure><img src="4-modern-motto-dark.svg" alt="4 · Modern, with the motto"><figcaption>4 · Modern, with the motto</figcaption></figure></section>
<section class="light small"><h2>Small, as in the site header</h2><figure><img src="1-roundel.svg" alt="1 · Roundel, for stickers"><figcaption>1 · Roundel, for stickers</figcaption></figure><figure><img src="4-modern.svg" alt="4 · Modern"><figcaption>4 · Modern</figcaption></figure><figure><img src="4-modern-motto.svg" alt="4 · Modern, with the motto"><figcaption>4 · Modern, with the motto</figcaption></figure></section>
<section class="light"><h2>Animated (for the README and slides, not the site)</h2>
<figure><img src="4-modern.gif" alt="Modern, animated"><figcaption>4-modern.gif</figcaption></figure>
<figure><img src="4-modern-motto.gif" alt="Modern with the motto, animated"><figcaption>4-modern-motto.gif</figcaption></figure></section>
<section class="dark"><h2>Animated, on dark</h2>
<figure><img src="4-modern-dark.gif" alt="Modern, animated, on dark"><figcaption>4-modern-dark.gif</figcaption></figure>
<figure><img src="4-modern-motto-dark.gif" alt="Modern with the motto, animated, on dark"><figcaption>4-modern-motto-dark.gif</figcaption></figure></section>
</body></html>
