{{/* The river (SPEC 4.4). Drawn once on load by CSS, shown finished with reduced motion (WWW-13, WWW-14). */}}
<figure class="river">
  <svg viewBox="0 0 800 150" role="img" aria-labelledby="river-title river-desc">
    <title id="river-title">The river Alpheus</title>
    <desc id="river-desc">A line flows in from the left, dips below a horizon line, continues as a dashed line underground, labelled chunks in object storage, and rises again on the right.</desc>
    <defs>
      <mask id="under-reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="800" height="150">
        <path class="draw draw-2" pathLength="1" d="M276 122 C300 134 500 134 524 122" stroke="#fff" stroke-width="10" fill="none"/>
      </mask>
    </defs>
    <line class="horizon" x1="0" y1="92" x2="800" y2="92"/>
    <path class="above draw draw-1" pathLength="1" d="M8 60 Q48 48 88 60 T168 60 T236 60 C256 62 262 100 276 122"/>
    <path class="under" mask="url(#under-reveal)" d="M276 122 C300 134 500 134 524 122"/>
    <path class="above draw draw-3" pathLength="1" d="M524 122 C538 100 544 62 564 60 Q604 48 644 60 T724 60 T786 60"/>
    <path class="above draw draw-4" pathLength="1" d="M772 51 L787 60 L772 69"/>
  </svg>
  <p class="river-label" aria-hidden="true">chunks in object storage</p>
  {{ with .Params.myth }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
