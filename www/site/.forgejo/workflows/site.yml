# Build, test and publish alpheus-dev.org (SPEC.md, section 6).
# Runs on Forgejo Actions in alpheus-dev/alpheus-dev.org (WWW-22, WWW-23).
# GitHub ignores .forgejo/, so the mirror runs nothing (WWW-44).
#
# Needs a runner with the label "docker", and in the repository settings:
#   secret   DEPLOY_SSH_KEY       private key that may only write the site directory
#   variable DEPLOY_KNOWN_HOSTS   the web server's host key line(s)
#   variable DEPLOY_TARGET        rsync target, e.g. deploy@web.example:/srv/alpheus-dev.org/
#   variable GO_MODULE_PUBLISHED  "true" once the Go module has code (WWW-20)

name: Site

on:
  push:
    branches: [main]
  pull_request:
  # The main repository triggers this through the Forgejo API on push and release (WWW-23).
  workflow_dispatch:

env:
  # Pinned Hugo (WWW-21). Keep in step with module.hugoVersion in hugo.toml.
  HUGO_VERSION: 0.168.0
  HUGO_SHA256: fada83ad56bb27ed4cb7dd81590303bdac16140f944ac4e66fc248117e2d5594

jobs:
  build:
    runs-on: docker
    container:
      image: node:22-bookworm
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Chromium, rsync and ssh
        run: |
          apt-get update
          apt-get install -y --no-install-recommends chromium rsync openssh-client

      - name: Install Hugo
        run: |
          file="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${file}"
          echo "${HUGO_SHA256}  ${file}" | sha256sum -c -
          tar -xzf "$file" -C /usr/local/bin hugo

      - name: Check colour contrast (WWW-9, WWW-41)
        run: python3 -I ci/check_contrast.py

      - name: Build
        run: hugo --gc --minify

      - name: Check external resources and front page weight (WWW-25, WWW-26)
        run: python3 -I ci/check_site.py

      - name: Accessibility test with axe (WWW-34)
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 -d public &
          sleep 1
          npx --yes pa11y-ci@4.1.1 --config ci/pa11yci.json
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium

      - name: Lighthouse (WWW-27)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=ci/lighthouserc.json
        env:
          CHROME_PATH: /usr/bin/chromium

      - name: List Go packages for the verify job
        id: packages
        run: |
          echo "packages=$(python3 -I -c 'import tomllib; print(" ".join(tomllib.load(open("data/gopackages.toml", "rb"))["packages"]))')" >> "$GITHUB_OUTPUT"

      - name: Publish to the web server (WWW-23)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rlz --checksum --delete-after \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            public/ "$DEPLOY_TARGET"
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}

  verify:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: docker
    container:
      image: golang:1-bookworm
    steps:
      - name: Vanity import pages answer go-get (WWW-17)
        run: |
          module=alpheus-dev.org/alpheus
          for path in "" $PACKAGES; do
            url="https://${module}${path:+/$path}?go-get=1"
            for attempt in 1 2 3 4 5 6; do
              if curl -fsSL "$url" | grep -Eq "name=\"?go-import\"? content=\"${module} git "; then
                echo "ok   $url"; continue 2
              fi
              sleep 10
            done
            echo "FAIL $url has no go-import tag"; exit 1
          done
        env:
          PACKAGES: ${{ needs.build.outputs.packages }}

      # Straight from the site, not proxy.golang.org's cache (WWW-20).
      - name: go list against the published site (WWW-20)
        if: vars.GO_MODULE_PUBLISHED == 'true'
        run: |
          export GOMODCACHE="$(mktemp -d)"
          go list -m alpheus-dev.org/alpheus@latest
        env:
          GOPROXY: direct
          GONOSUMDB: alpheus-dev.org
          GOFLAGS: -modcacherw
