{{- /* How a run looks on Kubernetes, as a still drawing in the river's
       language: pods above the horizon, object storage below it, and the
       data as the river between them (SPEC 3 point 4, WWW-13, WWW-15). */ -}}
<figure class="k8s">
  <svg viewBox="0 0 440 496" role="img" aria-labelledby="k8s-title k8s-desc">
    <title id="k8s-title">A run with three steps on Kubernetes</title>
    <desc id="k8s-desc">The alpheus-controller watches a StreamRun and creates one pod per step: read, filter and sum. Each pod has the step's component and an agent, which share files. Below the ground line is object storage. Read's agent uploads chunks to the stream read-filter in S3, and filter's agent downloads them; filter's agent uploads to filter-sum, which sum's agent downloads; sum's agent writes the result to S3. The agents tell each other that chunks are ready through the signal hub in the controller, over mutual TLS.</desc>

    <rect class="ground" x="0" y="360" width="440" height="100"/>
    <line class="horizon" x1="0" y1="360" x2="440" y2="360"/>

    <rect class="box" x="16" y="16" width="150" height="72" rx="6"/>
    <text class="label mono" x="91" y="47">StreamRun</text>
    <text class="note" x="91" y="70">kubectl apply</text>

    <path class="ctl" d="M166 52 H226"/>
    <path class="head-ctl" d="M224 47 L232 52 L224 57 Z"/>
    <text class="note" x="199" y="44">watches</text>

    <rect class="box" x="232" y="16" width="192" height="96" rx="6"/>
    <text class="label strong" x="328" y="41">alpheus-controller</text>
    <rect class="inner" x="248" y="54" width="160" height="44" rx="4"/>
    <text class="label" x="328" y="74">signal hub</text>
    <text class="note" x="328" y="91">mutual TLS</text>

    <path class="ctl" d="M256 112 V122 M71 122 H369 M71 122 V142 M220 122 V142 M369 122 V142"/>
    <path class="head-ctl" d="M66 142 L71 150 L76 142 Z M215 142 L220 150 L225 142 Z M364 142 L369 150 L374 142 Z"/>

    <path class="sig" d="M400 98 V138 H145 V270 M294 138 V270 M118 270 H173 M267 270 H322"/>

    <g class="pod">
      <rect class="frame" x="16" y="150" width="110" height="150" rx="8"/>
      <rect class="box" x="24" y="174" width="94" height="46" rx="4"/>
      <text class="label strong" x="71" y="195">read</text>
      <text class="note" x="71" y="212">component</text>
      <rect class="box" x="24" y="250" width="94" height="40" rx="4"/>
      <text class="label" x="71" y="275">agent</text>
    </g>
    <g class="pod">
      <rect class="frame" x="165" y="150" width="110" height="150" rx="8"/>
      <rect class="box" x="173" y="174" width="94" height="46" rx="4"/>
      <text class="label strong" x="220" y="195">filter</text>
      <text class="note" x="220" y="212">component</text>
      <rect class="box" x="173" y="250" width="94" height="40" rx="4"/>
      <text class="label" x="220" y="275">agent</text>
    </g>
    <g class="pod">
      <rect class="frame" x="314" y="150" width="110" height="150" rx="8"/>
      <rect class="box" x="322" y="174" width="94" height="46" rx="4"/>
      <text class="label strong" x="369" y="195">sum</text>
      <text class="note" x="369" y="212">component</text>
      <rect class="box" x="322" y="250" width="94" height="40" rx="4"/>
      <text class="label" x="369" y="275">agent</text>
    </g>

    <path class="ctl" d="M71 226 V244 M220 226 V244 M369 226 V244"/>
    <path class="head-ctl" d="M67 229 L71 222 L75 229 Z M67 241 L71 248 L75 241 Z M216 229 L220 222 L224 229 Z M216 241 L220 248 L224 241 Z M365 229 L369 222 L373 229 Z M365 241 L369 248 L373 241 Z"/>
    <text class="note start" x="79" y="240">files</text>
    <text class="note start" x="228" y="240">files</text>
    <text class="note start" x="377" y="240">files</text>

    <path class="data" d="M96 290 V360 M196 360 V298 M244 290 V360 M345 360 V298 M393 290 V360"/>
    <path class="head-data" d="M190 300 L196 290 L202 300 Z M339 300 L345 290 L351 300 Z M422 394 L432 400 L422 406 Z"/>
    <path class="under" d="M96 360 C96 402 196 402 196 360 M244 360 C244 402 345 402 345 360 M393 360 C393 390 402 400 422 400"/>
    <text class="label mono" x="146" y="420">read-filter</text>
    <text class="label mono" x="294" y="420">filter-sum</text>
    <text class="label mono end" x="432" y="424">result</text>
    <text class="note" x="220" y="448">object storage (S3): chunks, manifests and acks</text>

    <path class="ctl" d="M16 484 H40"/>
    <text class="note start" x="46" y="488">creates pods</text>
    <path class="data" d="M146 484 H170"/>
    <text class="note start" x="176" y="488">chunks</text>
    <path class="sig" d="M238 484 H262"/>
    <text class="note start" x="268" y="488">signals via the hub</text>
  </svg>
  <figcaption>A run with three steps. The components only see files; the agents move them through object storage and signal each other through the hub.</figcaption>
</figure>
