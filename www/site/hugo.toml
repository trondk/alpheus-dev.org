baseURL = "https://alpheus-dev.org/"
locale = "en"
title = "Alpheus"
theme = "alpheus"
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true

# Hugo is pinned in CI (WWW-21). Keep this in step with the workflow.
[module.hugoVersion]
  min = "0.168.0"

[params]
  # Project phase shown on the front page (WWW-8): design, alpha, beta or stable.
  phase = "design"
  # The Go module path never changes (WWW-19).
  goModule = "alpheus-dev.org/alpheus"
  # The primary repository on Forgejo; never the GitHub mirror (WWW-19).
  # Every link to the code is built from this. Until the Forgejo instance
  # exists, it points at GitHub.
  repo = "https://github.com/alpheus-dev/alpheus"
  repoBranch = "main"

[markup.highlight]
  # Classes instead of inline styles, so the CSP needs no 'unsafe-inline' (WWW-43).
  noClasses = false

[markup.goldmark.renderer]
  unsafe = false

[menus]
  [[menus.main]]
    name = "Docs"
    url = "/docs/"
    weight = 10
  [[menus.main]]
    name = "Getting started"
    url = "/docs/getting-started/"
    weight = 20
  [[menus.main]]
    name = "Development"
    url = "/development/"
    weight = 25
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 30
  # params.repo is a path in the repository given by params.repo above.
  [[menus.main]]
    name = "Repository"
    weight = 40
    params = { repo = "" }

  [[menus.footer]]
    name = "Apache License 2.0"
    weight = 10
    params = { repo = "LICENSE" }
  [[menus.footer]]
    name = "Governance"
    url = "/about/#governance"
    weight = 20
  [[menus.footer]]
    name = "Security"
    url = "/security/"
    weight = 30
  [[menus.footer]]
    name = "Privacy"
    url = "/privacy/"
    weight = 40
  [[menus.footer]]
    name = "Repository"
    weight = 50
    params = { repo = "" }
  [[menus.footer]]
    name = "Contact"
    url = "/about/#contact"
    weight = 60
