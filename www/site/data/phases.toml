# Text for each project phase (WWW-8). The current phase is params.phase in hugo.toml.

[design]
  name = "design phase"
  short = "There is no code yet."
  long = "The specifications are being agreed, and there is no code to run. Do not plan production use. The next phases are alpha, beta and stable, and this page will say which one applies."

[alpha]
  name = "alpha"
  short = "Not ready for production."
  long = "Alpheus runs, but the API and the chunk format may change between releases without a migration path. Use it to try things out, not for production data."

[beta]
  name = "beta"
  short = "Not yet recommended for production."
  long = "The API is close to stable, and changes come with a migration path. Production use is possible, but expect rough edges."

[stable]
  name = "stable"
  short = "Ready for production."
  long = "The API follows semantic versioning. Breaking changes only come with a new major version."
