# HAProxy 3.2: ends HTTPS for every external port (certificate from the test
# CA in _out/, for the VM's IP and registry.alpheus.test) and passes requests
# to the service behind it over plain HTTP inside the cluster. Backend names
# are looked up when needed, so the gateway starts before the services.

global
    log stdout format raw local0 info
    ssl-default-bind-options ssl-min-ver TLSv1.2

resolvers kube
    parse-resolv-conf
    hold valid 10s

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    # long: image pushes and S3 uploads
    timeout client 10m
    timeout server 10m
    timeout tunnel 1h
    default-server init-addr last,libc,none resolvers kube check inter 10s

# --- 30500 registry: Zot -------------------------------------------------------
frontend fe_registry
    bind :8500 ssl crt /etc/haproxy/tls/gateway.pem
    http-request set-header X-Forwarded-Proto https
    default_backend be_registry
backend be_registry
    server zot zot.registry.svc.cluster.local:5000

# --- 30900 storage: Garage S3 --------------------------------------------------
frontend fe_s3
    bind :8900 ssl crt /etc/haproxy/tls/gateway.pem
    http-request set-header X-Forwarded-Proto https
    default_backend be_s3
backend be_s3
    server garage garage.storage.svc.cluster.local:3900

# --- 30901 storage: Garage dashboard -------------------------------------------
frontend fe_garage-ui
    bind :8901 ssl crt /etc/haproxy/tls/gateway.pem
    http-request set-header X-Forwarded-Proto https
    default_backend be_garage-ui
backend be_garage-ui
    server garage-ui garage-ui.storage.svc.cluster.local:8080
