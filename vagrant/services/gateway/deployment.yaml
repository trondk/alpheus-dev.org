apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
  namespace: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haproxy
  template:
    metadata:
      labels:
        app: haproxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 99
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: haproxy
          image: docker.io/library/haproxy:3.2.26-alpine
          args: ["haproxy", "-W", "-db", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
          ports:
            - {name: registry, containerPort: 8500}
            - {name: s3, containerPort: 8900}
            - {name: garage-ui, containerPort: 8901}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: registry
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: registry
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy
              readOnly: true
            - name: tls
              mountPath: /etc/haproxy/tls
              readOnly: true
            - name: run
              mountPath: /var/run
      volumes:
        - name: config
          configMap:
            name: haproxy-config
        - name: tls
          secret:
            secretName: gateway-tls
        - name: run
          emptyDir: {}
