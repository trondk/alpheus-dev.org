# The external ports on the VM's IP, the same numbers as in MCPipe.
apiVersion: v1
kind: Service
metadata:
  name: haproxy
  namespace: gateway
spec:
  type: NodePort
  selector:
    app: haproxy
  ports:
    - {name: registry, port: 8500, targetPort: registry, nodePort: 30500}
    - {name: s3, port: 8900, targetPort: s3, nodePort: 30900}
    - {name: garage-ui, port: 8901, targetPort: garage-ui, nodePort: 30901}
