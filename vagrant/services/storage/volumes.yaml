# Garage's database and the objects' contents, both on the VM's disk.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-meta
  namespace: storage
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
  namespace: storage
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
