# local-path-provisioner v0.0.37, StorageClass "local-path" (the default): a
# folder on the VM's disk. upstream.yaml is copied unchanged from
# https://github.com/rancher/local-path-provisioner/blob/v0.0.37/deploy/local-path-storage.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - upstream.yaml
patches:
  - path: patches.yaml
