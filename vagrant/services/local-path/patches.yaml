# Changes to upstream.yaml (local-path-provisioner v0.0.37), as in MCPipe.

# The helper pods it starts to create and delete volume folders use
# hostPath, which only the privileged Pod Security level allows.
apiVersion: v1
kind: Namespace
metadata:
  name: local-path-storage
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
---
# Volumes are folders under /var/local-path-provisioner. /var is the only
# writable disk space on Talos; it survives a reboot (vagrant halt/up), but
# not destroy.sh. The helper image is pinned instead of busybox:latest.
kind: ConfigMap
apiVersion: v1
metadata:
  name: local-path-config
  namespace: local-path-storage
data:
  config.json: |-
    {
            "nodePathMap":[
            {
                    "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                    "paths":["/var/local-path-provisioner"]
            }
            ]
    }
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
      - name: helper-pod
        image: docker.io/library/busybox:1.37
        imagePullPolicy: IfNotPresent
---
# The only StorageClass in the test cluster, so it is the default.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
