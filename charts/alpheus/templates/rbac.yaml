{{- /* files/role.yaml is a copy of the generated ClusterRole (make generate). */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alpheus-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alpheus.labels" . | nindent 4 }}
{{ .Files.Get "files/role.yaml" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alpheus-controller
  labels:
    {{- include "alpheus.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alpheus-controller
subjects:
  - kind: ServiceAccount
    name: alpheus-controller
    namespace: {{ .Release.Namespace }}
